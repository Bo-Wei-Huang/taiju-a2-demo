<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>封面與目錄試作</title>
<!-- 2026-10-20 封面（方案三：電影感，由下往上仰望）和目錄（方案二：精品型錄風）的試作，見 docs/rundown.md 和本資料夾 README。
     建築大圖是 Nano Banana 畫的示意圖；點目錄的三幕先只跳提示，之後接進 app/ 的 3D 場景 -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root { --ink: #2c2c2a; --muted: #8a8984; --line: #dcd8d0; --accent: #c8643c; --paper: #f5f2ec; --gold: #c9a87c; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; }
  body { font-family: "Noto Serif TC", "PMingLiU", serif; }
  /* 固定 1600×900 的舞台，置中後依視窗等比縮放，電視上不會跑版 */
  #stage { position: absolute; left: 50%; top: 50%; width: 1600px; height: 900px; overflow: hidden; }
  .page { position: absolute; inset: 0; transition: opacity 1.4s ease; }
  .page.off { opacity: 0; pointer-events: none; }
  .fade { opacity: 0; transition: opacity 1.6s ease, transform 1.6s cubic-bezier(.22,.8,.25,1); transform: translateY(12px); }
  .show .fade { opacity: 1; transform: none; }

  /* 封面 */
  #cover { background: #111; cursor: pointer; }
  #cover .bg { position: absolute; inset: 0; background: url(cover-up-corner-nanobanana-output1.jpg) center / cover; transform: scale(1); }
  #cover.show .bg { animation: push 40s linear forwards; }
  @keyframes push { to { transform: scale(1.08) translate(0, 1%); } }
  #cover .shade { position: absolute; inset: 0; background: linear-gradient(90deg, rgba(40,28,50,.45) 0%, rgba(40,28,50,.18) 30%, rgba(40,28,50,0) 45%); }
  #cover .brand { position: absolute; left: 80px; top: 64px; font-size: 20px; letter-spacing: .5em; color: #f1e6da; }
  #cover .rule { position: absolute; left: 80px; top: 236px; width: 64px; height: 1px; background: var(--gold); }
  #cover h1 { position: absolute; left: 76px; top: 264px; margin: 0; font-size: 104px; font-weight: 500; letter-spacing: .12em; color: #fffaf3; line-height: 1; text-shadow: 0 2px 24px rgba(60,30,60,.35); }
  #cover .addr { position: absolute; left: 80px; top: 404px; font-size: 22px; letter-spacing: .3em; color: #f6ebe0; }
  #cover .start { position: absolute; left: 80px; top: 470px; font-size: 20px; letter-spacing: .3em; color: #f6ebe0; }
  .show .start { animation: breathe 3.2s ease-in-out 2.4s infinite; }
  @keyframes breathe { 0%, 100% { opacity: .35; } 50% { opacity: 1; } }
  .note { position: absolute; font-size: 16px; letter-spacing: .1em; font-family: system-ui, "Microsoft JhengHei", sans-serif; }
  #cover .note { right: 28px; bottom: 22px; color: #f6ebe0; text-shadow: 0 0 6px rgba(0,0,0,.4); }
  /* 封面淡出時先「天亮」，再換成淺色的目錄 */
  #dawn { position: absolute; inset: 0; background: var(--paper); opacity: 0; pointer-events: none; transition: opacity 1.1s ease; }

  /* 目錄 */
  #contents { background: var(--paper); color: var(--ink); }
  #contents .pic { position: absolute; right: 0; top: 0; width: 900px; height: 900px; overflow: hidden; }
  #contents .pic div { position: absolute; inset: 0; background: url(exterior-nanobanana-output2.jpg) 42% center / cover;
    transition: transform 2.4s cubic-bezier(.22,.8,.25,1), filter 2.4s ease; }
  #contents .brand { position: absolute; left: 96px; top: 72px; font-size: 20px; letter-spacing: .5em; color: var(--muted); }
  #contents .title { position: absolute; left: 92px; top: 132px; font-size: 64px; font-weight: 500; letter-spacing: .2em; margin: 0; }
  #contents .en { position: absolute; left: 98px; top: 222px; font-size: 16px; letter-spacing: .5em; color: var(--muted); font-family: system-ui, sans-serif; }
  .acts { position: absolute; left: 96px; top: 300px; width: 520px; }
  /* 整條都能點，滑鼠不用瞄很準 */
  .act { position: relative; display: block; padding: 26px 0 28px; border-top: 1px solid var(--line); cursor: pointer; }
  .act:last-child { border-bottom: 1px solid var(--line); }
  .act .no { position: absolute; left: 0; top: 24px; font-size: 22px; color: var(--accent); letter-spacing: .1em; }
  .act .name { display: block; margin-left: 72px; font-size: 44px; font-weight: 500; letter-spacing: .12em; color: #6d6b66; transition: color .5s; }
  .act .sub { display: block; margin: 8px 0 0 74px; font-size: 22px; color: var(--muted); letter-spacing: .08em; }
  .act .bar { position: absolute; left: 0; bottom: -1px; width: 0; height: 2px; background: var(--accent); transition: width .7s cubic-bezier(.22,.8,.25,1); }
  .act:hover .name { color: var(--ink); }
  .act:hover .bar { width: 100%; }
  .act .arrow { position: absolute; right: 0; top: 44px; font-size: 24px; color: var(--accent); opacity: 0; transform: translateX(-10px); transition: opacity .5s, transform .5s; }
  .act:hover .arrow { opacity: 1; transform: none; }
  #back { position: absolute; left: 96px; bottom: 64px; font-size: 20px; letter-spacing: .2em; color: var(--muted); cursor: pointer; }
  #back:hover { color: var(--ink); }
  #contents .note { right: 28px; bottom: 22px; color: #ece7df; text-shadow: 0 0 6px rgba(0,0,0,.4); }
  #toast { position: absolute; left: 96px; bottom: 120px; font-size: 22px; color: var(--accent); letter-spacing: .1em; opacity: 0; transition: opacity .5s; }
</style>
</head>
<body>
<div id="stage">

  <section id="contents" class="page off">
    <div class="pic"><div id="pic"></div></div>
    <div class="brand fade">太聚向暘</div>
    <h2 class="title fade">目錄</h2>
    <div class="en fade">CONTENTS</div>
    <div class="acts fade">
      <a class="act" data-act="0"><span class="no">01</span><span class="name">地段</span><span class="sub">在哪裡，生活多方便</span><span class="arrow">→</span><span class="bar"></span></a>
      <a class="act" data-act="1"><span class="no">02</span><span class="name">建築</span><span class="sub">從整棟到您的家</span><span class="arrow">→</span><span class="bar"></span></a>
      <a class="act" data-act="2"><span class="no">03</span><span class="name">品質與信心</span><span class="sub">用料、實績、保障</span><span class="arrow">→</span><span class="bar"></span></a>
    </div>
    <div id="toast"></div>
    <div id="back" class="fade">← 回封面</div>
    <div class="note">3D 畫面為示意圖</div>
  </section>

  <section id="cover" class="page">
    <div class="bg"></div>
    <div class="shade"></div>
    <div class="brand fade">太聚建設</div>
    <div class="rule fade"></div>
    <h1 class="fade">太聚向暘</h1>
    <div class="addr fade">沙鹿・向上路六段</div>
    <div class="start fade">點一下，開始介紹</div>
    <div class="note">3D 畫面為示意圖</div>
  </section>

  <div id="dawn"></div>
</div>
<script>
const $ = id => document.getElementById(id);
const stage = $('stage'), cover = $('cover'), contents = $('contents'), dawn = $('dawn'), pic = $('pic');

// 舞台依視窗等比縮放
function fit() { stage.style.transform = `translate(-50%, -50%) scale(${Math.min(innerWidth / 1600, innerHeight / 900)})`; }
addEventListener('resize', fit); fit();

// 文字依序淡入：每個 .fade 延後一點出場
function enter(page) {
  page.querySelectorAll('.fade').forEach((e, i) => e.style.transitionDelay = `${0.4 + i * 0.25}s`);
  page.classList.remove('off');
  requestAnimationFrame(() => requestAnimationFrame(() => page.classList.add('show')));
}
function leave(page) { page.classList.remove('show'); page.classList.add('off'); }

let busy = false;
function toContents() {
  if (busy) return; busy = true;
  dawn.style.opacity = 1;                              // 先「天亮」
  setTimeout(() => {
    leave(cover); cover.querySelector('.bg').style.animation = 'none';
    enter(contents);
    dawn.style.opacity = 0;
    setTimeout(() => busy = false, 1200);
  }, 1100);
}
function toCover() {
  if (busy) return; busy = true;
  leave(contents);
  setTimeout(() => {
    const bg = cover.querySelector('.bg'); bg.style.animation = ''; bg.offsetWidth;   // 推鏡從頭開始
    enter(cover);
    setTimeout(() => busy = false, 1200);
  }, 900);
}
cover.addEventListener('click', toContents);
$('back').addEventListener('click', toCover);

// 滑鼠停在哪一幕，右邊的模型就預覽那一幕（正式版改成 3D 鏡頭移動）
const PREVIEW = [
  { transform: 'scale(1)', filter: 'none' },                                   // 地段：拉遠，看得到周邊
  { transform: 'scale(1.22) translate(6%, 3%)', filter: 'none' },              // 建築：拉近主棟
  { transform: 'scale(1.06)', filter: 'sepia(.18) brightness(1.04)' },         // 品質與信心：整體暖一點
];
const REST = { transform: 'scale(1.06)', filter: 'none' };
function preview(p) { pic.style.transform = p.transform; pic.style.filter = p.filter; }
preview(REST);
const NAMES = ['第一幕　地段', '第二幕　建築', '第三幕　品質與信心'];
document.querySelectorAll('.act').forEach(a => {
  const i = +a.dataset.act;
  a.addEventListener('mouseenter', () => preview(PREVIEW[i]));
  a.addEventListener('mouseleave', () => preview(REST));
  a.addEventListener('click', () => {
    const t = $('toast'); t.textContent = `${NAMES[i]}：之後接進 3D 場景`; t.style.opacity = 1;
    clearTimeout(t._h); t._h = setTimeout(() => t.style.opacity = 0, 2400);
  });
});

// 3 分鐘沒操作就回封面（rundown 的待機規則；待機輪播之後再做）
let idle;
function poke() { clearTimeout(idle); idle = setTimeout(() => { if (cover.classList.contains('off')) toCover(); }, 180000); }
['mousemove', 'mousedown', 'keydown'].forEach(e => addEventListener(e, poke)); poke();
addEventListener('keydown', e => { if (e.key === 'Escape') toCover(); });

enter(cover);
</script>
</body>
</html>
