<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>太聚向暘</title>
    <!-- 給媽媽看的簡報（demo）：封面 → 目錄 → 各章內頁。八個場景的 3D 實驗在 experiment.html -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500&display=swap" rel="stylesheet" />
    <script type="module" crossorigin src="./assets/index-CnstfKiI.js"></script>
    <link rel="modulepreload" crossorigin href="./assets/style-D7Zje3qR.js">
    <link rel="stylesheet" crossorigin href="./assets/style-BeF5_tSm.css">
    <link rel="stylesheet" crossorigin href="./assets/index-BfUN3vRp.css">
  </head>
  <body class="demo">
    <canvas id="scene"></canvas>
    <!-- 3D 場景（world.js）會用到的元素，簡報裡用不到但要在 -->
    <div id="bars"><i></i><i></i></div>
    <div id="cine"><p></p><p></p></div>
    <div id="title-card"></div>
    <div id="hint"></div>
    <div id="loading"></div>

    <!-- 內頁的版面：上方目錄、左欄文案、下方翻頁（catalog.js） -->
    <div id="catalog">
      <header><button id="cat-home">← 返回</button><span id="cat-crumb"></span><button id="cat-reset" hidden>重設視角</button><span class="cat-brand">太聚向暘</span></header>
      <section id="cat-panel"></section>
      <nav id="floor-index"></nav>
      <nav id="room-list"></nav>
      <p id="cat-hint"></p>
      <p id="cat-toast"></p>
      <footer>
        <button id="cat-prev"></button>
        <i id="cat-progress"></i>
        <button id="cat-next"></button>
        <small id="cat-source">3D 畫面為示意圖｜樓層標高依建照圖說</small>
      </footer>
    </div>

    <!-- 封面和目錄：固定 1600×900 的舞台，依視窗等比縮放 -->
    <div id="deck">
      <div id="stage">
        <section id="contents" class="page off">
          <div class="pic"><div id="pic"></div></div>
          <div class="brand fade">太聚向暘</div>
          <h2 class="title fade">目錄</h2>
          <div class="en fade">CONTENTS</div>
          <div class="acts fade">
            <a class="act" data-page="location"><span class="no">01</span><span class="name">地段</span><span class="sub">在哪裡，生活多方便</span><span class="arrow">→</span><span class="bar"></span></a>
            <a class="act" data-page="campus"><span class="no">02</span><span class="name">建築</span><span class="sub">從整棟到您的家</span><span class="arrow">→</span><span class="bar"></span></a>
            <a class="act" data-page="quality"><span class="no">03</span><span class="name">品質與信心</span><span class="sub">用料、實績、保障</span><span class="arrow">→</span><span class="bar"></span></a>
          </div>
          <div id="back" class="fade">← 回封面</div>
          <div class="note">3D 畫面為示意圖</div>
        </section>

        <section id="cover" class="page">
          <div class="bg"></div>
          <div class="shade"></div>
          <div class="brand fade">太聚建設</div>
          <div class="rule fade"></div>
          <h1 class="fade">太聚向暘</h1>
          <div class="addr fade">沙鹿・向上路六段</div>
          <div class="start fade">點一下，開始介紹</div>
          <div class="note">3D 畫面為示意圖</div>
        </section>

        <div id="dawn"></div>
      </div>
    </div>
  </body>
</html>
